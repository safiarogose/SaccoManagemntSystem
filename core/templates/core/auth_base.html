<!doctype html>
{% load static %}
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PPSW SACCO</title>
    <link rel="stylesheet" href="{% static 'styles.css' %}">
    <style>
        :root {
            --auth-bg: #f5f6f8;
            --auth-card: #ffffff;
            --auth-ink: #2a3f54;
            --auth-muted: #73879c;
            --auth-line: #dbe3ea;
            --auth-blue: #000d83;
            --auth-green: #1abb9c;
            --auth-danger: #e74c3c;
        }

        * {
            box-sizing: border-box;
        }

        body.auth-portal-page {
            margin: 0;
            min-height: 100vh;
            background: var(--auth-bg);
            color: var(--auth-ink);
            font-family: "Segoe UI", Arial, Helvetica, sans-serif;
        }

        .auth-home-link {
            position: fixed;
            top: 20px;
            right: 24px;
            z-index: 2;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 40px;
            padding: 0 14px;
            border: 1px solid var(--auth-line);
            border-radius: 999px;
            background: #ffffff;
            color: var(--auth-blue);
            font-size: 13px;
            font-weight: 800;
            text-decoration: none;
            box-shadow: 0 10px 24px rgba(42, 63, 84, 0.08);
        }

        .auth-shell {
            display: grid;
            place-items: center;
            min-height: 100vh;
            padding: 64px 18px;
        }

        .auth-card {
            width: min(360px, 100%);
            overflow: hidden;
            border: 1px solid var(--auth-line);
            border-radius: 10px;
            background: var(--auth-card);
            box-shadow: 0 18px 48px rgba(42, 63, 84, 0.12);
        }

        .auth-brand {
            display: grid;
            justify-items: center;
            gap: 10px;
            padding: 26px 28px 20px;
            border-bottom: 1px solid var(--auth-line);
            background: #ffffff;
            text-align: center;
        }

        .brand-mark {
            display: grid;
            place-items: center;
            width: 42px;
            height: 42px;
            border: 1px solid var(--auth-line);
            border-radius: 50%;
            background: #ffffff;
            color: var(--auth-blue);
        }

        .brand-mark svg {
            width: 26px;
            height: 26px;
            fill: currentColor;
        }

        .brand-mark path + path {
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
        }

        .auth-brand strong,
        .auth-brand span {
            display: block;
        }

        .auth-brand strong {
            color: var(--auth-ink);
            font-size: 20px;
        }

        .auth-brand span {
            display: none;
        }

        .auth-heading {
            margin: 0 30px 22px;
            padding-top: 28px;
            text-align: center;
        }

        .eyebrow {
            margin: 0 0 8px;
            color: var(--auth-green);
            font-size: 12px;
            font-weight: 900;
            text-transform: uppercase;
        }

        .auth-heading h1 {
            margin: 0;
            color: var(--auth-ink);
            font-size: 30px;
            line-height: 1.12;
        }

        .auth-heading p:not(.eyebrow) {
            margin: 10px 0 0;
            color: var(--auth-muted);
            line-height: 1.55;
        }

        .auth-form {
            display: grid;
            grid-template-columns: 1fr;
            gap: 14px;
            padding: 24px 28px 28px;
        }

        .auth-form label {
            display: grid;
            gap: 6px;
            color: #44546a;
            font-size: 12px;
            font-weight: 800;
            text-align: left;
        }

        .auth-form input {
            width: 100%;
            min-height: 50px;
            padding: 0 12px;
            border: 1px solid var(--auth-line);
            border-radius: 6px;
            background: #fbfcfd;
            color: var(--auth-ink);
            font: inherit;
        }

        .auth-form input:focus {
            border-color: var(--auth-green);
            box-shadow: 0 0 0 3px rgba(26, 187, 156, 0.14);
            outline: 0;
        }

        .primary-button,
        .auth-submit {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 52px;
            border: 0;
            border-radius: 6px;
            background: var(--auth-blue);
            color: #ffffff;
            font: inherit;
            font-weight: 900;
            text-decoration: none;
            cursor: pointer;
        }

        .full {
            grid-column: 1 / -1;
        }

        .auth-footnote {
            margin: 24px 30px 30px;
            padding: 14px 16px;
            border: 1px solid var(--auth-line);
            border-radius: 6px;
            background: #f8fafc;
            text-align: center;
        }

        .auth-footnote span {
            display: block;
            color: var(--auth-blue);
            font-size: 12px;
            font-weight: 900;
            text-transform: uppercase;
        }

        .auth-footnote p {
            margin: 5px 0 0;
            color: var(--auth-muted);
            font-size: 13px;
            line-height: 1.45;
        }

        .auth-messages {
            display: grid;
            gap: 8px;
            margin: 18px 30px 0;
        }

        .auth-messages p {
            margin: 0;
            padding: 10px 12px;
            border-radius: 4px;
            background: #eaf5fc;
            color: #3498db;
            font-size: 13px;
        }

        .auth-messages .error {
            background: #fae9e6;
            color: var(--auth-danger);
        }

        @media (max-width: 720px) {
            .auth-home-link {
                right: 16px;
            }

            .auth-card {
                border-radius: 8px;
            }

            .auth-heading h1 {
                font-size: 27px;
            }
        }
    </style>
</head>
<body class="gentelella-theme auth-page auth-portal-page">
    <a class="auth-home-link" href="{% url 'home' %}">Back to SACCO Home</a>
    <main class="auth-shell">
        <section class="auth-card">
            <div class="auth-brand">
                <div class="brand-mark" aria-hidden="true">
                    <svg viewBox="0 0 24 24" role="img">
                        <path d="M12 2 20 5v6c0 5.2-3.2 9.8-8 11-4.8-1.2-8-5.8-8-11V5l8-3Z"/>
                        <path d="M8 12h8M12 8v8"/>
                    </svg>
                </div>
                <div>
                    <strong>PPSW SACCO</strong>
                </div>
            </div>

            {% if messages %}
                <div class="auth-messages">
                    {% for message in messages %}
                        <p class="{{ message.tags }}">{{ message }}</p>
                    {% endfor %}
                </div>
            {% endif %}

            {% block auth_content %}{% endblock %}
        </section>
    </main>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="{% static 'app.js' %}" defer></script>
</body>
</html>
