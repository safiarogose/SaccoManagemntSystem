{% extends "core/base.html" %}

{% block content %}
<section class="view active-view">
    <section class="panel">
        <div class="panel-head">
            <h2>{{ action }} {{ model_title }}</h2>
            <a class="ghost-button auth-link" href="{% url 'model-list' model_name %}">Back</a>
        </div>
        <form class="form-grid" method="post">
            {% csrf_token %}
            {% if form.non_field_errors %}
                <div class="auth-messages full">
                    <p class="error">{{ form.non_field_errors|striptags }}</p>
                </div>
            {% endif %}
            {% for field in form %}
                <label class="{% if field.field.widget.input_type == 'textarea' %}full{% endif %}">
                    {{ field.label }}
                    {{ field }}
                    {% if field.errors %}<span class="red">{{ field.errors|striptags }}</span>{% endif %}
                </label>
            {% endfor %}
            <button class="primary-button full" type="submit">Save</button>
        </form>
    </section>
</section>
{% endblock %}
