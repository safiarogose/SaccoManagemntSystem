{% extends "core/base.html" %}

{% block content %}
<section class="view active-view">
    <div class="dashboard-filter">
        <div class="filter-group">
            <a class="segmented active auth-link" href="{% url 'reports' %}">Summary</a>
            <a class="segmented auth-link" href="{% url 'model-list' 'members' %}">Members</a>
            <a class="segmented auth-link" href="{% url 'model-list' 'accounts' %}">Accounts</a>
            <a class="segmented auth-link" href="{% url 'model-list' 'loans' %}">Loans</a>
        </div>
        <div class="filter-group">
            <button class="ghost-button" type="button" onclick="window.print()">Print</button>
        </div>
    </div>

    <div class="report-grid">
        {% for report in report_cards %}
            <article class="report-card">
                <strong>{{ report.title }}</strong>
                <span>{{ report.count }} records{% if report.total != "" %} | UGX {{ report.total|floatformat:0 }}{% endif %}</span>
                <a class="ghost-button auth-link" href="{% url 'model-list' report.url %}">Open</a>
            </article>
        {% endfor %}
    </div>
</section>
{% endblock %}
