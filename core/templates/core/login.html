{% extends "core/auth_base.html" %}

{% block auth_content %}
<div class="auth-heading">
    <p class="eyebrow">Secure Staff Portal</p>
    <h1>Staff Login</h1>
    <p>Sign in with your authorized SACCO credentials.</p>
</div>

<form class="form-grid auth-form" method="post">
    {% csrf_token %}
    <label class="full">Username<input name="username" autocomplete="username" placeholder="Enter username" required autofocus></label>
    <label class="full">Password<input name="password" type="password" autocomplete="current-password" placeholder="Enter password" required></label>
    <button class="primary-button full auth-submit" type="submit">Sign In</button>
</form>

<div class="auth-footnote">
    <span>Protected portal</span>
    <p>For SACCO staff, management, loans officers, tellers, accountants, and auditors only.</p>
</div>
{% endblock %}
