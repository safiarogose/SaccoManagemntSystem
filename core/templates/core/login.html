{% extends "core/auth_base.html" %}

{% block auth_content %}
<form class="form-grid auth-form" method="post">
    {% csrf_token %}
    <label class="full">Username<input name="username" autocomplete="username" placeholder="Example: admin" required autofocus></label>
    <label class="full">Password<input name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required></label>
    <button class="primary-button full auth-submit" type="submit">Sign In</button>
</form>
{% endblock %}
