<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PPSW SACCO System</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body.system-launcher {
            display: grid;
            place-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            background:
                linear-gradient(135deg, rgba(0, 13, 131, 0.9), rgba(42, 63, 84, 0.78)),
                url("static/images/sacco-hero.png") center / cover;
        }

        .launcher-card {
            width: min(760px, 100%);
            padding: 34px;
            border: 1px solid rgba(255, 255, 255, 0.22);
            border-radius: 10px;
            background: #ffffff;
            box-shadow: 0 24px 70px rgba(0, 13, 131, 0.28);
        }

        .launcher-brand {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 22px;
        }

        .launcher-mark {
            display: grid;
            place-items: center;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #000d83;
            color: #ffffff;
            font-size: 22px;
            font-weight: 900;
        }

        .launcher-brand strong,
        .launcher-brand span {
            display: block;
        }

        .launcher-brand span {
            margin-top: 3px;
            color: #73879c;
            font-size: 13px;
        }

        .launcher-card h1 {
            margin: 0;
            color: #2a3f54;
            font-size: clamp(30px, 4vw, 44px);
            line-height: 1.1;
        }

        .launcher-card p {
            max-width: 620px;
            color: #73879c;
            font-size: 16px;
            line-height: 1.7;
        }

        .launcher-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 24px;
        }
    </style>
</head>
<body class="system-launcher">
    <main class="launcher-card">
        <div class="launcher-brand">
            <span class="launcher-mark">P</span>
            <span>
                <strong>PPSW SACCO</strong>
                <span>Parliamentary Police Saving Welfare SACCO</span>
            </span>
        </div>
        <h1>Run the Django SACCO management system.</h1>
        <p>This package is delivered as a Django application. Start the server, then open the public SACCO home or the protected staff dashboard.</p>
        <div class="launcher-actions">
            <a class="primary-button auth-link" href="http://127.0.0.1:8000/">Open SACCO Home</a>
            <a class="ghost-button auth-link" href="http://127.0.0.1:8000/login/">Open Staff Login</a>
        </div>
    </main>
</body>
</html>
